[package]
name = "pt-cli"
description = "Command-line harness for the Polarity Transcribe engine (benchmarks and tests)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pt"
path = "src/main.rs"

[features]
vulkan = ["pt-core/vulkan"]
metal = ["pt-core/metal"]

[dependencies]
pt-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
