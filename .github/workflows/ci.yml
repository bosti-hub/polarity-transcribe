name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15] # macos-15 = Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}

    steps:
      # Windows runners convert LF to CRLF on checkout by default, which breaks shell scripts.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # Windows-only build flags for whisper.cpp (mirrors .cargo/config.example.toml).
      # cmake-rs strips MSVC /O flags; cl.exe prepends the CL variable, which restores them.
      # GGML_* pin a portable x86-64 baseline (AVX2/FMA/F16C, ~2013+) instead of the runner's CPU.
      # whisper-rs-sys forwards GGML_* environment variables to CMake.
      # Written to GITHUB_ENV so they apply to every later step of this job, on Windows only.
      - name: Configure Windows build environment
        if: runner.os == 'Windows'
        shell: bash
        run: |
          {
            echo "CL=/O2 /Ob2 /DNDEBUG"
            echo "GGML_NATIVE=OFF"
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
            echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # The cached whisper.cpp CMake build remembers the full path of the MSVC compiler. On a
      # runner image with another MSVC version that path is gone and CMake fails ("is not a full
      # path to an existing compiler tool"), so the MSVC version is part of the cache key.
      - name: MSVC version (cache key)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $tools = (Get-Content (Join-Path $vs "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt")).Trim()
          "MSVC_TOOLS=$tools" >> $env:GITHUB_ENV
          "MSVC tools: $tools"

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate caches per OS (and MSVC version); the whisper.cpp CMake build is the
          # expensive part.
          key: ci-${{ env.MSVC_TOOLS }}

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Engine tests
        run: cargo test -p pt-core --locked

      # tauri::generate_context! requires frontendDist (../dist) to exist at compile time.
      # An empty directory is enough for a check; the real frontend build happens in release.yml.
      - name: Create placeholder dist/
        shell: bash
        run: mkdir -p dist

      - name: Check app crate
        run: cargo check -p polarity-transcribe --locked
