[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bosti-hub/polarity-transcribe"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# DSP and inference glue are unusably slow unoptimised; keep debug builds responsive.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
